name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - name: Stylesheet declarations are current
        run: |
          npm run styles:types
          if ! git diff --quiet -- 'src/**/*.module.css.d.ts'; then
            echo "Generated CSS module declarations are stale. Run npm run styles:types and commit."
            git --no-pager diff --stat -- 'src/**/*.module.css.d.ts'
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run arch-lint
      - run: npm test
      - run: npm run build

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm audit --audit-level=high

  version-bump:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:package.json" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          HEAD_VERSION=$(node -pe 'require("./package.json").version')
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "package.json's version must be bumped from $BASE_VERSION before merging."
            exit 1
          fi
          echo "Version bumped: $BASE_VERSION -> $HEAD_VERSION"
